[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nl2t-uasn"
version = "1.0.0"
description = "Reference implementation of NL2T for UASNs."
readme = "README.md"
authors = [
    {name = "A. Hussain", email = "altafkfm74@gmail.com"},
    {name = "S. Li", email = "lishuaiyong@cqupt.edu.cn"},
    {name = "A. H. Farhan", email = "ahasanul.cse519@nubtkhulna.ac.bd"},
]
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = ["numpy>=1.24", "scipy>=1.11", "pyyaml>=6.0"]

[project.optional-dependencies]
plot = ["matplotlib>=3.8"]
test = ["pytest>=7.4"]

[tool.setuptools.packages.find]
include = ["nl2t*", "scripts*"]
